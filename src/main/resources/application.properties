# Gizli bilgiler proje klasorundeki .env dosyasindan (veya ortam degiskenlerinden) okunur.
spring.config.import=optional:file:.env[.properties]

spring.application.name=voltflow
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/voltflowdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Ilk acilista olusturulacak demo kullanici sifreleri (.env). Bos birakilirsa kullanici olusturulmaz.
voltflow.seed.admin-password=${VOLTFLOW_ADMIN_PASSWORD:}
voltflow.seed.employee-password=${VOLTFLOW_EMPLOYEE_PASSWORD:}
