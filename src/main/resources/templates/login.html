<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>VoltFlow — Sisteme Giriş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { 
                        palette1: '#46A094', palette2: '#6BBD99', palette3: '#AECFA4', palette4: '#C4E8C2', 
                        textMain: '#1A332F', textMuted: '#5B7A75', danger: '#E05A5A', success: '#6BBD99'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#e4f5ee] text-textMain min-h-screen font-sans flex items-center justify-center p-4">

    <div class="bg-white border border-palette4 rounded-3xl p-10 w-full max-w-md shadow-xl relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-palette1 to-palette2"></div>
        
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-palette4/30 rounded-full flex items-center justify-center mx-auto mb-4 border border-palette3/50">
                <i class="fa-solid fa-bolt text-3xl text-palette1"></i>
            </div>
            <h1 class="text-2xl font-black text-textMain tracking-widest mb-1">VOLTFLOW</h1>
            <p class="text-[10px] text-textMuted uppercase font-bold tracking-widest">Yetkili Giriş Portalı</p>
        </div>

        <div th:if="${param.error}" class="bg-danger/10 border border-danger/20 text-danger text-xs font-bold p-3.5 rounded-xl mb-6 flex items-center gap-2">
            <i class="fa-solid fa-circle-exclamation"></i> Kullanıcı adı veya şifre hatalı!
        </div>
        <div th:if="${param.logout}" class="bg-palette2/10 border border-palette2/20 text-palette1 text-xs font-bold p-3.5 rounded-xl mb-6 flex items-center gap-2">
            <i class="fa-solid fa-shield-check"></i> Sistemden güvenli şekilde çıkış yapıldı.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-5">
            <div>
                <label class="block text-[10px] font-bold text-textMuted uppercase tracking-wider mb-2">Kullanıcı Adı</label>
                <div class="relative">
                    <i class="fa-regular fa-user absolute left-4 top-1/2 -translate-y-1/2 text-textMuted"></i>
                    <input type="text" name="username" required placeholder="admin veya personel" class="w-full bg-palette4/10 border border-palette3/50 rounded-xl pl-11 pr-4 py-3 text-textMain text-sm focus:outline-none focus:border-palette1 focus:ring-1 focus:ring-palette1 transition-colors shadow-sm" />
                </div>
            </div>
            <div>
                <label class="block text-[10px] font-bold text-textMuted uppercase tracking-wider mb-2">Güvenlik Şifresi</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-textMuted"></i>
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-palette4/10 border border-palette3/50 rounded-xl pl-11 pr-4 py-3 text-textMain text-sm focus:outline-none focus:border-palette1 focus:ring-1 focus:ring-palette1 transition-colors shadow-sm" />
                </div>
            </div>
            <button type="submit" class="w-full py-3.5 bg-palette1 text-white font-bold text-sm rounded-xl hover:bg-[#3b8a7f] transition-all shadow-md hover:shadow-lg mt-6 flex justify-center items-center gap-2">
                SİSTEME GİRİŞ YAP <i class="fa-solid fa-right-to-bracket"></i>
            </button>
            <a href="/" class="block text-center text-xs text-textMuted font-bold hover:text-palette1 transition-colors mt-4">
                Ana Sayfaya Dön
            </a>
        </form>
    </div>
</body>
</html>
