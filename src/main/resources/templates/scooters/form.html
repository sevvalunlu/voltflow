<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>VoltFlow — Araç Profili</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { 
                        palette1: '#46A094', palette2: '#6BBD99', palette3: '#AECFA4', palette4: '#C4E8C2', 
                        cardBg: '#ffffff', textMain: '#1A332F', textMuted: '#5B7A75', danger: '#E05A5A', warning: '#F0A54A', success: '#6BBD99'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-[#e4f5ee] text-textMain min-h-screen font-sans flex">

    <aside class="w-64 bg-white border-r border-palette4 shadow-sm flex flex-col fixed h-full z-50">
        <div class="px-6 h-20 border-b border-palette4 flex items-center gap-3">
            <i class="fa-solid fa-bolt text-palette1 text-2xl"></i>
            <span class="text-palette1 text-xl font-black tracking-widest">VOLTFLOW</span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <a href="/dashboard" class="flex items-center gap-3 px-4 py-3 text-textMuted hover:text-palette1 hover:bg-palette4/20 rounded-xl font-semibold transition-all group">
                <i class="fa-solid fa-chart-pie text-lg group-hover:scale-110 transition-transform"></i> Dashboard
            </a>
            <a sec:authorize="hasRole('ADMIN')" href="/map" class="flex items-center gap-3 px-4 py-3 text-textMuted hover:text-palette1 hover:bg-palette4/20 rounded-xl font-semibold transition-all group">
                <i class="fa-solid fa-map-location-dot text-lg group-hover:scale-110 transition-transform"></i> Canlı Harita
            </a>
            <a href="/scooters" class="flex items-center gap-3 px-4 py-3 text-textMuted hover:text-palette1 hover:bg-palette4/20 rounded-xl font-semibold transition-all group">
                <i class="fa-solid fa-motorcycle text-lg group-hover:scale-110 transition-transform"></i> Araç Filosu
            </a>
            <a sec:authorize="hasRole('ADMIN')" href="/scooters/new" class="flex items-center gap-3 px-4 py-3 bg-palette4/30 text-palette1 rounded-xl font-bold transition-all border border-palette3/50">
                <i class="fa-solid fa-plus text-lg"></i> Yeni Araç Ekle
            </a>
        </nav>
        <div class="p-4 border-t border-palette4 bg-palette4/10">
            <div class="flex items-center gap-3 px-2">
                <div class="w-8 h-8 rounded-full bg-palette1/10 text-palette1 flex items-center justify-center font-bold text-xs border border-palette1/20">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <div class="text-xs font-bold text-textMain uppercase" sec:authentication="name">KULLANICI</div>
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="text-[10px] text-textMuted hover:text-danger transition-colors cursor-pointer mt-0.5">Sistemden Çıkış</button>
                    </form>
                </div>
            </div>
        </div>
    </aside>

    <main class="flex-1 pl-64 min-h-screen flex flex-col">
        <header class="h-20 border-b border-palette4 px-10 flex items-center justify-between bg-white/80 backdrop-blur-md sticky top-0 z-40 shadow-sm">
            <div class="flex items-center gap-3">
                <h1 class="text-xl font-black text-textMain tracking-wide" th:text="${scooter.id == null} ? 'Yeni Araç Entegrasyonu' : 'Araç Bilgilerini Güncelle'">Veri Girişi</h1>
            </div>
        </header>

        <div class="p-10 max-w-3xl w-full mx-auto">
            <div class="bg-white border border-palette4 rounded-2xl p-8 shadow-sm">
                <form th:action="${scooter.id == null} ? '/scooters' : '/scooters/update/' + ${scooter.id}" th:object="${scooter}" method="post" class="space-y-6">
                    
                    <div>
                        <label class="block text-[11px] font-bold text-textMuted uppercase tracking-wider mb-2">Donanım Seri Numarası</label>
                        <input type="text" th:field="*{serialNumber}" placeholder="Örn: VF-2026-X8" class="w-full bg-white border border-palette3/60 rounded-xl px-4 py-3 text-textMain focus:outline-none focus:border-palette1 focus:ring-1 focus:ring-palette1 transition-colors shadow-sm" />
                        <span class="text-danger text-xs font-bold mt-1.5 block" th:if="${#fields.hasErrors('serialNumber')}" th:errors="*{serialNumber}"></span>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold text-textMuted uppercase tracking-wider mb-2">Araç Modeli / Üretici</label>
                        <input type="text" th:field="*{model}" placeholder="Örn: Segway Ninebot Max" class="w-full bg-white border border-palette3/60 rounded-xl px-4 py-3 text-textMain focus:outline-none focus:border-palette1 focus:ring-1 focus:ring-palette1 transition-colors shadow-sm" />
                        <span class="text-danger text-xs font-bold mt-1.5 block" th:if="${#fields.hasErrors('model')}" th:errors="*{model}"></span>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-[11px] font-bold text-textMuted uppercase tracking-wider mb-2">Batarya Kapasitesi (%)</label>
                            <input type="number" th:field="*{batteryLevel}" step="0.1" placeholder="85.0" class="w-full bg-white border border-palette3/60 rounded-xl px-4 py-3 text-textMain focus:outline-none focus:border-palette1 focus:ring-1 focus:ring-palette1 transition-colors shadow-sm" />
                            <span class="text-danger text-xs font-bold mt-1.5 block" th:if="${#fields.hasErrors('batteryLevel')}" th:errors="*{batteryLevel}"></span>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold text-textMuted uppercase tracking-wider mb-2">İlk Operasyon Durumu</label>
                            <select th:field="*{status}" class="w-full bg-white border border-palette3/60 rounded-xl px-4 py-3 text-textMain focus:outline-none focus:border-palette1 focus:ring-1 focus:ring-palette1 cursor-pointer shadow-sm">
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="p-5 bg-[#e4f5ee]/50 border border-palette4 rounded-xl grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-[10px] font-bold text-textMuted uppercase tracking-wider mb-2"><i class="fa-solid fa-location-crosshairs mr-1"></i>Enlem Koordinatı (Latitude)</label>
                            <input type="number" name="latitude" th:value="${scooter.location != null} ? ${scooter.location.latitude} : ''" step="0.000001" placeholder="41.0151" class="w-full bg-transparent border-b border-palette3/80 pb-2 text-sm text-textMain focus:outline-none focus:border-palette1 placeholder-palette3" />
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-textMuted uppercase tracking-wider mb-2"><i class="fa-solid fa-location-crosshairs mr-1"></i>Boylam Koordinatı (Longitude)</label>
                            <input type="number" name="longitude" th:value="${scooter.location != null} ? ${scooter.location.longitude} : ''" step="0.000001" placeholder="28.9795" class="w-full bg-transparent border-b border-palette3/80 pb-2 text-sm text-textMain focus:outline-none focus:border-palette1 placeholder-palette3" />
                        </div>
                    </div>

                    <div class="flex gap-4 pt-4 border-t border-palette4">
                        <button type="submit" class="px-6 py-3 bg-palette1 text-white font-bold text-xs rounded-xl hover:bg-[#3b8a7f] transition-all shadow-sm"><i class="fa-solid fa-check mr-2"></i>VERİYİ KAYDET</button>
                        <a href="/scooters" class="px-6 py-3 bg-white border border-palette4 text-textMuted font-bold text-xs rounded-xl hover:bg-palette4/20 transition-all">İPTAL</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
